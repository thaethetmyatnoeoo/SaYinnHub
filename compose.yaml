services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sayinn
      POSTGRES_USER: sayinn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sayinn_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayinn"]
      interval: 5s
      retries: 10
volumes:
  sayinn_data:
